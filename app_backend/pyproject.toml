[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animal-detection-workbench-backend"
version = "0.1.0"
description = "FastAPI worker for the Animal Detection Workbench desktop app."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "Pillow>=10.0",
  "opencv-python-headless>=4.8.0",
  "PyYAML>=6.0.1",
  "gdown>=5.2.0",
  "huggingface_hub>=0.23.0",
  "pyarrow>=15.0.0",
]

[project.optional-dependencies]
train = [
  "ultralytics>=8.4.0",
  "PyYAML>=6.0.1",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["animal_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
